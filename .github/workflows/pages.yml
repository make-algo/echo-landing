name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  # Cada PR pasa la misma compilación y comprobación de copy antes de poder
  # fusionarse (protección de `main`): así un choque entre PR paralelos se
  # para en el PR y no rompe el despliegue.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelamos el que ya está en vuelo. Los PR van
# en su propio grupo y un push nuevo al PR cancela la comprobación anterior.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Las garantías se imponen, no se dejan a mano: si un cambio rompe el
      # noindex o cuela un recurso de un dominio ajeno, el despliegue falla
      # aquí en vez de publicarse en silencio.
      - run: npm run verificar
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
